# LADE profile configuration — reviewer
#
# Generated from .hermes/config/profiles.md §2. Do not add toolsets here
# without changing that file and recording the change in .hermes/CHANGELOG.md.
#
# Hermes has no toolset allowlist, so least privilege is expressed as
# `agent.disabled_toolsets`: everything not enabled below is denied.
#
# Model: single source is .hermes/config/models.yaml. setup.sh renders the
# `lade:model`, `lade:fallback` and `lade:reasoning` regions below; do not
# edit them by hand. See .hermes/config/models.yaml and config/profiles.md §2.

# >>> lade:model (generated from .hermes/config/models.yaml by setup.sh -- do not edit) >>>
model:
  default: deepseek/deepseek-v4.1-flash
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
# <<< lade:model <<<
# >>> lade:fallback (generated from .hermes/config/models.yaml by setup.sh -- do not edit) >>>
fallback_providers: []
# <<< lade:fallback <<<

agent:
  # >>> lade:reasoning (generated from .hermes/config/models.yaml by setup.sh -- do not edit) >>>
  reasoning_effort: high
  # <<< lade:reasoning <<<
  disabled_toolsets:
    - bot_room
    - browser
    - catalog
    - code_execution
    - coding
    - computer_use
    - connections
    - context_engine
    - cronjob
    - debugging
    - delegation
    - desktop_ui
    - discord
    - discord_admin
    - feishu_doc
    - feishu_drive
    - hermes-acp
    - hermes-api-server
    - hermes-bluebubbles
    - hermes-cli
    - hermes-cron
    - hermes-dingtalk
    - hermes-discord
    - hermes-email
    - hermes-feishu
    - hermes-gateway
    - hermes-matrix
    - hermes-mattermost
    - hermes-qqbot
    - hermes-signal
    - hermes-slack
    - hermes-sms
    - hermes-telegram
    - hermes-webhook
    - hermes-wecom
    - hermes-wecom-callback
    - hermes-weixin
    - hermes-whatsapp
    - image_gen
    - kanban
    - memory
    - onboarding
    - project
    - safe
    - search
    - session_search
    - tts
    - video
    - video_gen
    - vision
    - web
    - x_search

# Shell commands are approval-gated; file writes never are.
approvals:
  mode: smart

skills:
  # Skills are symlinked into this profile's skills/ by setup.sh,
  # derived from .hermes/agents/reviewer/AGENTS.md. The repo skill tree is
  # not scanned again, so the role's surface stays exact.
  project_discovery: false
  disabled: []
