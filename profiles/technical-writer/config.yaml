# LADE profile configuration — technical-writer
#
# Generated from .hermes/config/profiles.md §2. Do not add toolsets here
# without changing that file and recording the change in .hermes/CHANGELOG.md.
#
# Hermes has no toolset allowlist, so least privilege is expressed as
# `agent.disabled_toolsets`: everything not enabled below is denied.
#
# Model: single source is .hermes/config/models.yaml. setup.sh renders the
# `lade:model`, `lade:fallback` and `lade:reasoning` regions below; do not
# edit them by hand. See .hermes/config/models.yaml and config/profiles.md §2.

# >>> lade:model (generated from .hermes/config/models.yaml by setup.sh -- do not edit) >>>
model:
  default: anthropic/claude-haiku-5.5
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
# <<< lade:model <<<
# >>> lade:fallback (generated from .hermes/config/models.yaml by setup.sh -- do not edit) >>>
fallback_providers: []
# <<< lade:fallback <<<

agent:
  # >>> lade:reasoning (generated from .hermes/config/models.yaml by setup.sh -- do not edit) >>>
  # <<< lade:reasoning <<<
  # Bundles/postures that CARRY wanted tools MUST NOT be listed here: the runtime subtracts
  # agent.disabled_toolsets at TOOL granularity and LAST, so naming `debugging` (which carries
  # read_file/write_file/patch/search_files/terminal/process_manage) or `coding` strips those
  # tools even though `file` and `terminal` are never disabled by name. Guard: make tools-check.
  disabled_toolsets:
    - bot_room
    - browser
    - catalog
    - code_execution
    - computer_use
    - connections
    - context_engine
    - cronjob
    - delegation
    - desktop_ui
    - discord
    - discord_admin
    - feishu_doc
    - feishu_drive
    - hermes-acp
    - hermes-api-server
    - hermes-bluebubbles
    - hermes-cli
    - hermes-cron
    - hermes-dingtalk
    - hermes-discord
    - hermes-email
    - hermes-feishu
    - hermes-gateway
    - hermes-matrix
    - hermes-mattermost
    - hermes-qqbot
    - hermes-signal
    - hermes-slack
    - hermes-sms
    - hermes-telegram
    - hermes-webhook
    - hermes-wecom
    - hermes-wecom-callback
    - hermes-weixin
    - hermes-whatsapp
    - image_gen
    - kanban
    - memory
    - onboarding
    - project
    - safe
    - search
    - session_search
    - terminal
    - tts
    - video
    - video_gen
    - vision
    - web
    - x_search

skills:
  # Skills are symlinked into this profile's skills/ by setup.sh,
  # derived from .hermes/agents/technical-writer/AGENTS.md. The repo skill tree is
  # not scanned again, so the role's surface stays exact.
  project_discovery: false
  disabled: []
telemetry:
  shared_metrics:
    enabled: false
    send: false
    offer_version: 2
_config_version: 54
