# models.yaml
#
# Version: 0.2.0 (LADE v2.3.0) | Date: 2026-11-15 | Location: config/models.yaml
# Normative single source of truth for which AI model each LADE role runs on.
# Only humans edit this file (AGENTS.md §11). setup.sh renders the model:,
# fallback_providers: and agent.reasoning_effort regions of every
# profiles/<role>/config.yaml from this file; `setup.sh --check` reports drift
# and writes nothing.
#
# Per-profile model. Each role names its OWN model, so you keep full control of
# which specialist is scaled to each profile -- no role is forced into a shared
# preset. `classes` below is an OPTIONAL convenience: a role may write
# `class: <name>` instead of a model, and a role's own `model:` (when present)
# always wins over its class.
#
# One key. All roles share the single OPENROUTER_API_KEY in $HERMES_HOME/.env;
# only the model id changes per role.
# Precedence: roles.<role> (inline keys) > classes.<class> > defaults.

version: 0.2.0

# Provider routing shared by every role unless a role overrides it.
defaults:
  provider: openrouter
  base_url: https://openrouter.ai/api/v1

# OPTIONAL preset library. Reference one from a role with `class: <name>` to
# avoid repeating a model. Presets are pure convenience; nothing requires them.
# To list candidates for a model id: hermes model --refresh
classes:
  coding: {model: deepseek/deepseek-v4-pro}
  reasoning: {model: deepseek/deepseek-v4.1-flash, reasoning_effort: high}
  text: {model: anthropic/claude-haiku-5.5}
  generalist: {model: deepseek/deepseek-v4.1-flash}

# Per-profile model -- the primary layer. Each role lists its own model.
# Recognized keys per role: model, provider, base_url, reasoning_effort, fallback
# and class (a preset name). `model` wins over `class`; omitted keys fall back to
# the class, then to `defaults`. Written by
#   ./setup.sh --model <role>=<model>
#   make models-set ROLE=<role> MODEL=<model>
roles:
  orchestrator:
    model: deepseek/deepseek-v4.1-flash          # intake/routing: reliable tool use
  architect:
    model: deepseek/deepseek-v4.1-flash          # design + ADR
    reasoning_effort: high
  software-engineer:
    model: deepseek/deepseek-v4-pro              # implementation: code, APIs, tests
  data-engineer:
    model: deepseek/deepseek-v4-pro              # pipelines, data contracts
  geospatial-engineer:
    model: deepseek/deepseek-v4-pro              # raster/vector, EO
  ai-engineer:
    model: deepseek/deepseek-v4.1-flash          # agents, evaluation, LLM integration
    reasoning_effort: high
  devops-sre:
    model: deepseek/deepseek-v4.1-flash          # containers, deploy, observability
  technical-writer:
    model: anthropic/claude-haiku-5.5            # long-form prose, documentation
  reviewer:
    model: deepseek/deepseek-v4.1-flash          # adversarial review
    reasoning_effort: high
